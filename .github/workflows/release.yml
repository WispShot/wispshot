name: Release

# Push a tag like v0.2.0 (matching Cargo.toml) to build, test and package a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo.toml v$ver" }

      - name: MinGW-w64 (UCRT) for dlltool and windres
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Rust (GNU toolchain)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        run: cargo build --release --locked

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process target/release/wispshot.exe -ArgumentList '--selftest', "$pwd\selftest" -Wait -PassThru
          Get-Content selftest/selftest.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Exe target/release/wispshot.exe

      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "WispShot $ver" }
          $notes | Set-Content -Encoding utf8 notes.md
          gh release create "${{ github.ref_name }}" dist/* --draft --title "WispShot $ver" --notes-file notes.md
